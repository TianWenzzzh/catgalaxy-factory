name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# 同一条分支上新的 push 直接顶掉还在跑的旧任务：这套流程单次要几分钟，
# 排队跑完一个已经被覆盖的提交没有意义。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows 不是凑数的：原子写重试认的是 WinError 32/33（文件被杀软/索引器占用），
    # 路径分隔符、GBK 控制台这些坑也只在 Windows 上出现，而交付对象就是 Windows 用户。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    env:
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      # Windows runner 的 Defender 实时扫描会长时间占住 pytest 临时目录里被
      # 高频重写的文件（WinError 5 连续 4 秒不放手，2026-09-15 实测把写方
      # 200 次重试预算都耗光；本机同测试 730 全绿）。runner 是一次性的隔离
      # 环境，排除临时目录只影响这台机器；真实用户杀软的瞬态占用仍由
      # atomic_replace 的重试兜住，不在 CI 上假装他们不存在。
      - name: Windows 排除临时目录的实时扫描
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:TEMP", "$env:RUNNER_TEMP"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: pytest
        run: python -m pytest -q

      # 只跑 demo2：full76 要读 E 盘总库里的真实名册与 75 张原图，那是本地实测证据，
      # 不该也没法进 CI。demo2 在 E 盘缺失时会自动回退——表头用内置 12 列，
      # F6 用合成 batch，其余 F1-F5 / F7-F11 全走真实 HTTP 接口，一条不少。
      - name: 验收脚本（demo2，不依赖 E 盘）
        run: python scripts/acceptance.py --case demo2

      - name: 上传验收证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence-${{ matrix.os }}
          path: docs/验收证据-*.md
          if-no-files-found: warn

  # v29 双形态真实渲染冒烟：Chromium 只装 ubuntu（Windows 装它成本高、
  # 收益与 test 矩阵的 Windows pytest 不重叠——施工书 F4 的取舍）。
  # 冒烟覆盖：lazy 初始仅 00 关键片、影廊按需取片、relative 零分片、
  # file:// 离线红线、0 pageerror。产物与断言全在临时工作区，不碰仓库外。
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # dev extra 里是 TestClient（smoke 用进程内 API 种项目），不能只装基础包
          python -m pip install -e ".[dev]" playwright

      - name: 安装 Chromium
        run: python -m playwright install --with-deps chromium

      - name: v29 双形态浏览器冒烟（http + file://）
        run: python scripts/smoke_v29.py

      - name: 上传冒烟截图与证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-v29-evidence
          path: |
            docs/验收证据-F3-双形态冒烟.md
            docs/screenshots-f3/
          if-no-files-found: warn
