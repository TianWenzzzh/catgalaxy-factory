[project]
name = "catgalaxy-factory"
version = "1.0.0"
description = "喵星图工厂 · 校园猫咪星图批量生成工具"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "pyyaml>=6.0", "websockets>=12"]

# 显式声明：根目录还有 static/（前端资源），新版 setuptools 平铺布局自动发现
# 会因「多个顶层包」拒绝构建（CI 首跑卡死在 pip install -e 这一步）。
[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
