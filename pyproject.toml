[project]
name = "catgalaxy-factory"
version = "1.0.0"
description = "喵星图工厂 · 校园猫咪星图批量生成工具"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "pyyaml>=6.0", "websockets>=12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
